name: Deploy APIVue to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build APIVue
        env:
          VITE_SUPABASE_URL: https://ehabrjqrfhgwdlmbcwho.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7Xrz670taHQak6WmDMiPrg_VqFH86Ys
        run: npm run build

      # GitHub Pages serves 404.html for deep links. Copying the SPA entry
      # point lets React Router recover routes such as /APIVue/dashboard.
      - name: Configure SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
