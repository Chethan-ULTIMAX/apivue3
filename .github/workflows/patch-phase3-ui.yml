name: Apply Phase 3 integration UI patch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch integration sync controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/integrations/IntegrationsView.tsx')
          text = path.read_text()

          old_import = "  getIntegrationStatus,\n  syncGitHub,\n} from '@/lib/integrations/api';"
          new_import = "  getIntegrationStatus,\n  syncGitHub,\n  syncIntegration,\n} from '@/lib/integrations/api';"
          if old_import not in text:
              raise SystemExit('expected integration API import was not found')
          text = text.replace(old_import, new_import, 1)

          old_handler = """  /* ---------- Tracked-profile actions ---------- */"""
          new_handler = """  /* ---------- Sync connected provider ---------- */

  const handleSyncProvider = useCallback(
    async (id: IntegrationId) => {
      setBusyPlatform(id);
      setConnectionError(null);
      try {
        if (id === 'github') {
          await syncGitHub();
        } else {
          await syncIntegration(id);
        }
        await loadAccountStatus();
        toast({ title: `${getIntegration(id).name} synced` });
      } catch (err) {
        const message = (err as Error).message;
        setConnectionError(message);
        toast({
          title: `${getIntegration(id).name} sync failed`,
          description: message,
          variant: 'destructive',
        });
      } finally {
        setBusyPlatform(null);
      }
    },
    [loadAccountStatus],
  );

  /* ---------- Tracked-profile actions ---------- */"""
          if old_handler not in text:
              raise SystemExit('tracked-profile marker was not found')
          text = text.replace(old_handler, new_handler, 1)

          old_summary = """                      onSync={
                        integration.id === 'github'
                          ? handleSyncGitHub
                          : undefined
                      }
                      canSync={integration.id === 'github'}"""
          new_summary = """                      onSync={() => handleSyncProvider(integration.id)}
                      canSync={true}"""
          if old_summary not in text:
              raise SystemExit('sync summary block was not found')
          text = text.replace(old_summary, new_summary, 1)

          old_call = """  const handleSyncGitHub = useCallback(async () => {
    setBusyPlatform('github');
    try {
      await syncGitHub();
      await loadAccountStatus();
      toast({ title: 'GitHub synced' });
    } catch (err) {
      const message = (err as Error).message;
      setConnectionError(message);
      toast({
        title: 'GitHub sync failed',
        description: message,
        variant: 'destructive',
      });
    } finally {
      setBusyPlatform(null);
    }
  }, [loadAccountStatus]);

"""
          if old_call not in text:
              raise SystemExit('legacy GitHub sync handler was not found')
          text = text.replace(old_call, '', 1)

          path.write_text(text)
          PY

      - name: Validate changed frontend file
        run: |
          grep -q "syncIntegration" src/features/integrations/IntegrationsView.tsx
          grep -q "canSync={true}" src/features/integrations/IntegrationsView.tsx

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/integrations/IntegrationsView.tsx .github/workflows/patch-phase3-ui.yml
          git commit -m "feat: enable sync controls for all connected providers" || exit 0
          git rm .github/workflows/patch-phase3-ui.yml
          git commit -m "chore: remove one-time phase 3 patch workflow"
          git push
